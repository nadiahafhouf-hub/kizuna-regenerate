{% load ui %}
<div class="reveal py-2 text-center">
  <span class="mx-auto grid h-14 w-14 place-items-center rounded-2xl bg-zgreen-bg text-zgreen"><i data-lucide="check" class="h-7 w-7"></i></span>
  <p class="mt-3 text-lg font-semibold">{{ T.diagnostic.form.success }} · {{ r.id }}</p>
  <p class="mt-1 text-sm text-muted">{{ T.diagnostic.row }} {{ r.ligne }} · {{ T.diagnostic.col }} {{ r.col }} · {{ r.date }}</p>
  <p class="mt-4 text-sm text-muted">{{ T.diagnostic.form.result }}</p>
  <div class="mt-2">{% zone_badge r.couleur variant="solid" size="lg" long=True %}</div>
  <div class="mt-6 flex flex-col-reverse gap-2 sm:flex-row sm:justify-center">
    <button type="button" hx-get="{% url 'diagnostics:new_reading' pid %}" hx-target="closest div.reveal" hx-swap="outerHTML"
            class="rounded-xl px-4 py-2.5 font-semibold text-olive-800 ring-1 ring-olive-200 hover:bg-olive-50">{{ T.diagnostic.form.another }}</button>
    <button type="button" @click="$dispatch('close-modal')" class="rounded-xl bg-olive-700 px-5 py-2.5 font-semibold text-white hover:bg-olive-800">{{ T.app.close }}</button>
  </div>
</div>
