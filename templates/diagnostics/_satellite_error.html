<div class="flex flex-wrap items-center gap-3 rounded-xl bg-sand-50 px-4 py-3 text-sm text-muted ring-1 ring-sand-200">
  <i data-lucide="cloud-off" class="h-5 w-5"></i>
  <span>{{ T.satellite.error }}: {{ error }}</span>
  <button type="button" hx-post="{% url 'diagnostics:satellite' pid %}" hx-target="closest div" hx-swap="outerHTML"
          class="ml-auto rounded-lg px-3 py-1.5 text-xs font-semibold text-olive-800 ring-1 ring-olive-200 hover:bg-olive-50">{{ T.satellite.retry }}</button>
</div>
