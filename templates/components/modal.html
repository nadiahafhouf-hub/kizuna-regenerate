{% comment %}
Modale générique (Alpine). Paramètres : name (événement d'ouverture « open-<name> »), title, icon, body (template à inclure), width (max-w-*)
Ouvrir : $dispatch('open-<name>') · Fermer : $dispatch('close-modal')
{% endcomment %}
<div x-data="{ open: false }" x-cloak
     @open-{{ name }}.window="open = true; $nextTick(() => icons())"
     @close-modal.window="open = false" @keydown.escape.window="open = false">
  <div x-show="open" x-transition.opacity class="fixed inset-0 z-[1450] bg-ink/40 backdrop-blur-sm"></div>
  <div x-show="open" class="fixed inset-0 z-[1460] flex items-end justify-center p-0 sm:items-center sm:p-6"
       role="dialog" aria-modal="true" aria-label="{{ title }}">
    <div x-show="open" @click.outside="open = false"
         x-transition:enter="transition ease-out duration-200" x-transition:enter-start="opacity-0 translate-y-6 sm:translate-y-0 sm:scale-95" x-transition:enter-end="opacity-100 translate-y-0 sm:scale-100"
         x-transition:leave="transition ease-in duration-150" x-transition:leave-start="opacity-100" x-transition:leave-end="opacity-0"
         class="max-h-[92vh] w-full {{ width|default:'max-w-lg' }} overflow-y-auto rounded-t-3xl bg-white shadow-lift sm:rounded-3xl">
      <div class="sticky top-0 z-10 flex items-center gap-3 border-b border-sand-100 bg-white/95 px-6 py-4 backdrop-blur">
        {% if icon %}<span class="grid h-9 w-9 place-items-center rounded-xl bg-olive-100 text-olive-700"><i data-lucide="{{ icon }}" class="h-[18px] w-[18px]"></i></span>{% endif %}
        <h2 class="flex-1 text-lg font-semibold tracking-tight">{{ title }}</h2>
        <button type="button" @click="open = false" class="rounded-lg p-2 text-muted hover:bg-sand-100 hover:text-ink" aria-label="{{ T.app.close }}">
          <i data-lucide="x" class="h-5 w-5"></i>
        </button>
      </div>
      <div class="px-6 py-5">
        {% include body %}
      </div>
    </div>
  </div>
</div>
