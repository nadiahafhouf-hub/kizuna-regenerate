{{ chat_config|json_script:"chat-config" }}
<div x-data="chatbot('{% url 'core:chat' %}')" @keydown.escape.window="open = false">
  <!-- Bouton flottant -->
  <button type="button" @click="toggle()" x-show="!open" x-transition
          class="fixed bottom-5 right-5 z-[1300] flex items-center gap-2 rounded-full bg-olive-700 py-3 pl-3.5 pr-4 font-semibold text-white shadow-lift ring-4 ring-white/70 transition hover:bg-olive-800 focus:outline-none focus-visible:ring-sun-300"
          aria-label="{{ T.chat.open }}">
    <span class="relative grid h-7 w-7 place-items-center rounded-full bg-white/15">
      <i data-lucide="message-circle-more" class="h-[18px] w-[18px]"></i>
      <span class="absolute -right-0.5 -top-0.5 h-2.5 w-2.5 rounded-full bg-sun-300 ring-2 ring-olive-700"></span>
    </span>
    <span class="hidden text-sm sm:inline">{{ T.chat.open }}</span>
  </button>

  <!-- Fond -->
  <div x-show="open" x-transition.opacity @click="open = false" x-cloak
       class="fixed inset-0 z-[1300] bg-ink/20 backdrop-blur-[1px] sm:bg-ink/10"></div>

  <!-- Panneau -->
  <aside x-show="open" x-cloak
         x-transition:enter="transition ease-out duration-300" x-transition:enter-start="translate-x-full" x-transition:enter-end="translate-x-0"
         x-transition:leave="transition ease-in duration-200" x-transition:leave-start="translate-x-0" x-transition:leave-end="translate-x-full"
         class="fixed inset-y-0 right-0 z-[1400] flex w-full flex-col bg-sand-50 shadow-lift sm:w-[420px]"
         role="dialog" aria-label="{{ T.chat.title }}">
    <div class="flex items-center gap-3 border-b border-sand-200 bg-white px-5 py-4">
      <span class="grid h-10 w-10 place-items-center rounded-xl bg-olive-100 text-olive-700"><i data-lucide="leaf" class="h-5 w-5"></i></span>
      <div class="min-w-0 flex-1">
        <p class="font-semibold">{{ T.chat.title }}</p>
        <p class="truncate text-xs text-muted">{{ T.chat.subtitle }}</p>
      </div>
      <button type="button" @click="open = false" class="rounded-lg p-2 text-muted hover:bg-sand-100 hover:text-ink" aria-label="{{ T.app.close }}">
        <i data-lucide="x" class="h-5 w-5"></i>
      </button>
    </div>

    <div x-ref="scroll" class="flex-1 space-y-3 overflow-y-auto px-5 py-5">
      <template x-for="(m, i) in messages" :key="i">
        <div class="flex flex-col" :class="m.role === 'user' ? 'items-end' : 'items-start'">
          <div dir="auto" class="max-w-[85%] whitespace-pre-line rounded-2xl px-4 py-2.5 text-sm leading-relaxed shadow-sm"
               :class="m.role === 'user' ? 'rounded-br-md bg-olive-700 text-white' : 'rounded-bl-md bg-white text-ink ring-1 ring-sand-200'"
               x-text="m.text"></div>
          <!-- actions recommandées (liens vers les pages de l'application) -->
          <div x-show="m.actions && m.actions.length" class="mt-2 flex max-w-[85%] flex-wrap gap-1.5">
            <template x-for="a in (m.actions || [])" :key="a.id">
              <a :href="a.url" class="inline-flex items-center gap-1 rounded-full bg-olive-700 px-3 py-1.5 text-xs font-semibold text-white transition hover:bg-olive-800">
                <span x-text="a.label"></span><span aria-hidden="true">→</span>
              </a>
            </template>
          </div>
          <details x-show="m.sources && m.sources.length" class="mt-1 max-w-[85%] text-[11px] text-muted">
            <summary class="cursor-pointer">{{ T.chat.sources }} (<span x-text="(m.sources || []).length"></span>)<span x-show="m.mode === 'gemini'"> · Gemini</span></summary>
            <ul class="mt-1 space-y-0.5">
              <template x-for="s in (m.sources || [])" :key="s.titre + s.score">
                <li><a :href="s.url || '#'" class="hover:underline" x-text="s.titre + ' · ' + (s.source || '')"></a></li>
              </template>
            </ul>
          </details>
        </div>
      </template>
      <div x-show="typing" class="flex justify-start">
        <div class="flex gap-1 rounded-2xl rounded-bl-md bg-white px-4 py-3 ring-1 ring-sand-200">
          <span class="typing-dot"></span><span class="typing-dot"></span><span class="typing-dot"></span>
        </div>
      </div>
      <div x-show="messages.length <= 1" class="pt-2">
        <p class="mb-2 text-xs font-semibold uppercase tracking-wide text-muted">{{ T.chat.suggestions }}</p>
        <div class="flex flex-wrap gap-2">
          <template x-for="s in suggestions" :key="s">
            <button type="button" @click="send(s)" x-text="s"
                    class="rounded-full bg-white px-3 py-1.5 text-left text-sm text-olive-800 ring-1 ring-olive-200 transition hover:bg-olive-50"></button>
          </template>
        </div>
      </div>
    </div>

    <form @submit.prevent="send()" class="flex items-center gap-2 border-t border-sand-200 bg-white p-3">
      <input x-model="input" x-ref="input" type="text" dir="auto" placeholder="{{ T.chat.placeholder }}" autocomplete="off"
             class="min-w-0 flex-1 rounded-xl border-0 bg-sand-100 px-4 py-2.5 text-sm ring-1 ring-sand-200 placeholder:text-muted focus:bg-white focus:ring-2 focus:ring-olive-600">
      <button type="submit" :disabled="!input.trim() || typing"
              class="grid h-10 w-10 place-items-center rounded-xl bg-olive-700 text-white transition hover:bg-olive-800 disabled:opacity-40" aria-label="{{ T.chat.send }}">
        <i data-lucide="send-horizontal" class="h-[18px] w-[18px]"></i>
      </button>
    </form>
  </aside>
</div>
